{% extends "base.html" %}
{% block content %}

<section class="container mx-auto max-w-7xl px-6 py-12">
  <div class="mb-10 max-w-3xl">
    <p class="mb-3 inline-flex items-center rounded-full border border-white/25 bg-white/10 px-4 py-2 text-sm font-semibold text-white/85">
      <i class="fas fa-paper-plane mr-2 text-cyan-200"></i>Contact
    </p>
    <h1 class="mb-4">Contact Us</h1>
    <p class="text-xl text-white/80">Send a message or reach us directly. We will get back to you as soon as possible.</p>
  </div>

  <div class="grid grid-cols-1 gap-8 lg:grid-cols-5">
    <div class="glass-effect rounded-2xl p-8 lg:col-span-3">
      <h2 class="mb-6">Get In Touch</h2>
      <form method="post">
        {% csrf_token %}
        <div class="grid grid-cols-1 gap-5">
          <input type="text" name="name" placeholder="Your name" required>
          <input type="email" name="email" placeholder="Your email" required>
          <textarea name="message" rows="5" placeholder="Your message" required></textarea>
          <button class="bg-gradient-to-r from-blue-500 to-purple-600 text-white px-6 py-3 rounded-lg font-semibold transition-all duration-300 flex items-center justify-center">
            <i class="fas fa-paper-plane mr-2"></i>Send Message
          </button>
        </div>
      </form>
    </div>

    <div class="glass-effect rounded-2xl p-8 lg:col-span-2">
      <h2 class="mb-6">Contact Info</h2>
      <div class="space-y-4">
        <a href="mailto:mahfujurrahmansaif@gmail.com" class="flex items-start rounded-xl border border-white/15 bg-white/10 p-4 transition hover:bg-white/15">
          <span class="mr-4 flex h-11 w-11 items-center justify-center rounded-xl bg-white/10 text-cyan-200">
            <i class="fas fa-envelope"></i>
          </span>
          <span>
            <span class="block text-sm font-semibold text-white/65">Email</span>
            <span class="block break-all font-semibold text-white">mahfujurrahmansaif@gmail.com</span>
          </span>
        </a>
        <a href="tel:+880151892201" class="flex items-start rounded-xl border border-white/15 bg-white/10 p-4 transition hover:bg-white/15">
          <span class="mr-4 flex h-11 w-11 items-center justify-center rounded-xl bg-white/10 text-cyan-200">
            <i class="fas fa-phone"></i>
          </span>
          <span>
            <span class="block text-sm font-semibold text-white/65">Phone</span>
            <span class="block font-semibold text-white">+880151892201</span>
          </span>
        </a>
      </div>

      <div class="mt-8">
        <h3 class="mb-4">Social Links</h3>
        <div class="flex flex-wrap gap-3">
          <a href="https://github.com/saif-dev-19" class="flex h-11 w-11 items-center justify-center rounded-xl border border-white/15 bg-white/10 text-white transition hover:bg-white/20">
            <i class="fab fa-github text-xl"></i>
          </a>
          <a href="https://linkedin.com/in/mahfuzsaif" class="flex h-11 w-11 items-center justify-center rounded-xl border border-white/15 bg-white/10 text-white transition hover:bg-white/20">
            <i class="fab fa-linkedin text-xl"></i>
          </a>
          <a href="https://www.facebook.com/hey.mahfuz.here.ok" class="flex h-11 w-11 items-center justify-center rounded-xl border border-white/15 bg-white/10 text-white transition hover:bg-white/20">
            <i class="fab fa-facebook text-xl"></i>
          </a>
          <a href="https://instagram.com/_mahfuzolozy_" class="flex h-11 w-11 items-center justify-center rounded-xl border border-white/15 bg-white/10 text-white transition hover:bg-white/20">
            <i class="fab fa-instagram text-xl"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</section>

{% endblock content %}
