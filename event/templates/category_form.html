{% extends "base.html" %}

{% block content %}
<div class="min-h-screen py-10">
    <div class="container mx-auto px-6">
        <div class="mx-auto max-w-2xl">
            <div class="mb-8 text-center">
                <h1 class="text-4xl font-bold text-white mb-3">Create Category</h1>
                <p class="text-white/80">Add a clean category to organize events more clearly.</p>
            </div>

            {% if messages %}
                <div class="mb-6 space-y-3">
                    {% for message in messages %}
                        <div class="glass-effect rounded-xl px-4 py-3 {% if message.tags == 'success' %}bg-green-500/20 border border-green-500/30{% endif %} {% if message.tags == 'error' %}bg-red-500/20 border border-red-500/30{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="POST" class="glass-effect rounded-2xl p-8 space-y-5">
                {% csrf_token %}
                {{ category_form.as_p }}
                <button type="submit" class="bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-600 hover:to-pink-700 px-6 py-3 text-white rounded-xl font-semibold transition-all duration-300">
                    Submit
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
