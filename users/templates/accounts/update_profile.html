{% extends "base.html" %}
{% block content %}
    <div class='mx-auto max-w-2xl my-10 px-6'>
        {% if messages %}
            {% for message in messages %}
                <div class="glass-effect rounded-xl px-4 py-3 mb-4 {% if message.tags == 'success' %}bg-green-500/20 border border-green-500/30{% endif %}">{{message}}</div>
            {% endfor %}
        {% endif %}
        <form method='POST' enctype='multipart/form-data' class="glass-effect rounded-2xl p-8 space-y-5">
            {% csrf_token %}
            {{ form.as_p }}
            <button class='bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 px-6 py-3 rounded-xl text-white font-semibold transition-all duration-300' type="submit">Update Profile</button>
        </form>
    </div>
{% endblock content %}
