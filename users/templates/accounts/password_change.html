{% extends "base.html" %}

{% block content %}

    <div class="my-10 max-w-2xl mx-auto px-6">
        {% if messages %}
                {% for message in messages %}
                    <div class="glass-effect rounded-xl px-4 py-3 mb-4 {% if message.tags == 'success' %}bg-green-500/20 border border-green-500/30{%endif %} {% if message.tags == 'error' %}bg-red-500/20 border border-red-500/30{%endif %}">{{message}}</div>
                {% endfor %}
        {% endif %}
        <form action="" method="POST" class="glass-effect rounded-2xl p-8 space-y-5">
            {% csrf_token %}
               {{form.as_p}}
            <button type="submit" class="bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 px-6 py-3 text-white rounded-xl font-semibold transition-all duration-300">Change Password</button>
        </form>
    </div>
{% endblock content %}
